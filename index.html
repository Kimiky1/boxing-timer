<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e0f12">
<title>Boxing Timer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boxing Timer">
<style>
:root{
  --bg:#0e0f12; --card:#181a20; --line:#2a2d36; --text:#f2f3f5; --mute:#8b90a0;
  --work:#e5352b; --rest:#22b573; --prep:#e8a317; --accent:#f2f3f5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;transition:background .25s}
body.work{background:#2a0f0e} body.rest{background:#0c2a1d} body.prep{background:#2a2108}
body.done{background:#151a2c}
.screen{display:none;flex:1;flex-direction:column;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));max-width:520px;width:100%;margin:0 auto}
.screen.on{display:flex}
h1{font-size:1.5rem;margin:6px 0 18px;letter-spacing:.5px}
.row{display:flex;align-items:center;justify-content:space-between;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.row .lbl{font-size:1.05rem}
.row .sub{font-size:.8rem;color:var(--mute);margin-top:2px}
.step{display:flex;align-items:center;gap:10px;direction:ltr}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#23262f;
  color:var(--text);font-size:1.5rem;line-height:1;cursor:pointer;touch-action:manipulation}
.step button:active{background:#323644}
.step .val{min-width:76px;text-align:center;font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.total{color:var(--mute);text-align:center;margin:6px 0 16px;font-size:.95rem}
.big{border:0;border-radius:18px;padding:18px;font-size:1.35rem;font-weight:800;cursor:pointer;
  background:var(--work);color:#fff;width:100%;touch-action:manipulation}
.big:active{filter:brightness(.85)}
.toggle{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:.9rem;justify-content:center;margin-top:14px}
.toggle input{width:20px;height:20px}
/* run screen */
#run{align-items:center;justify-content:space-between;text-align:center}
#phase{font-size:2.2rem;font-weight:900;letter-spacing:2px;margin-top:10px}
#roundInfo{color:var(--mute);font-size:1.1rem;margin-top:4px}
#time{font-size:min(34vw,170px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;direction:ltr}
.bar{width:100%;height:10px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden;direction:ltr}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}
body.work .bar i{background:var(--work)} body.rest .bar i{background:var(--rest)} body.prep .bar i{background:var(--prep)}
#next{color:var(--mute);min-height:1.4em}
.ctrl{display:flex;gap:12px;width:100%}
.ctrl button{flex:1;border:1px solid var(--line);background:#23262f;color:var(--text);border-radius:16px;
  padding:16px 8px;font-size:1.1rem;font-weight:700;cursor:pointer;touch-action:manipulation}
.ctrl button.stop{background:#3a1a19;border-color:#5a2624}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:#fff}
#flash.go{animation:fl .5s ease-out}
@keyframes fl{from{opacity:.35}to{opacity:0}}
</style>
</head>
<body>

<div id="setup" class="screen on">
  <h1><img src="icon-192.png" alt="" style="width:34px;height:34px;vertical-align:middle"> Boxing Timer</h1>

  <div class="row"><div><div class="lbl">Round time</div><div class="sub">On the bag</div></div>
    <div class="step" data-k="work" data-step="5" data-min="5" data-max="1800"><button data-d="-1">−</button><span class="val"></span><button data-d="1">+</button></div></div>

  <div class="row"><div><div class="lbl">Break</div><div class="sub">Between rounds</div></div>
    <div class="step" data-k="rest" data-step="5" data-min="0" data-max="600"><button data-d="-1">−</button><span class="val"></span><button data-d="1">+</button></div></div>

  <div class="row"><div><div class="lbl">Rounds</div></div>
    <div class="step" data-k="rounds" data-step="1" data-min="1" data-max="50"><button data-d="-1">−</button><span class="val"></span><button data-d="1">+</button></div></div>

  <div class="row"><div><div class="lbl">Get ready</div><div class="sub">Countdown before the start</div></div>
    <div class="step" data-k="prep" data-step="5" data-min="0" data-max="120"><button data-d="-1">−</button><span class="val"></span><button data-d="1">+</button></div></div>

  <div class="total" id="total"></div>
  <button class="big" id="start">START</button>
  <label class="toggle"><input type="checkbox" id="warn"> Warning beep 10 seconds before the round ends</label>
</div>

<div id="run" class="screen">
  <div>
    <div id="phase">—</div>
    <div id="roundInfo"></div>
  </div>
  <div id="time">0:00</div>
  <div style="width:100%">
    <div class="bar"><i id="barfill"></i></div>
    <div id="next" style="margin-top:12px"></div>
  </div>
  <div class="ctrl">
    <button id="pause">⏸ Pause</button>
    <button id="skip">⏭ Skip</button>
    <button id="stop" class="stop">■ Stop</button>
  </div>
</div>

<div id="flash"></div>

<script>
// ---------- settings ----------
const DEF = {work:70, rest:10, rounds:10, prep:10, warn:false};
let S = {...DEF};
try { Object.assign(S, JSON.parse(localStorage.getItem('boxtimer')||'{}')); } catch(e){}
const save = () => { try{ localStorage.setItem('boxtimer', JSON.stringify(S)); }catch(e){} };

const fmt = s => { s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const $ = id => document.getElementById(id);

function renderSetup(){
  document.querySelectorAll('.step').forEach(el=>{
    const k=el.dataset.k;
    el.querySelector('.val').textContent = (k==='rounds') ? S[k] : fmt(S[k]);
  });
  const total = S.prep + S.rounds*S.work + (S.rounds-1)*S.rest;
  $('total').textContent = `Total workout: ${fmt(total)} min · ${S.rounds} rounds`;
  $('warn').checked = S.warn;
}
document.querySelectorAll('.step').forEach(el=>{
  const k=el.dataset.k, st=+el.dataset.step, mn=+el.dataset.min, mx=+el.dataset.max;
  el.querySelectorAll('button').forEach(b=>{
    let t;
    const bump=()=>{ S[k]=Math.min(mx,Math.max(mn,S[k]+(+b.dataset.d)*st)); renderSetup(); save(); };
    b.addEventListener('pointerdown',e=>{ bump(); t=setTimeout(function rep(){ bump(); t=setTimeout(rep,90); },450); });
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(t)));
  });
});
$('warn').onchange = e => { S.warn=e.target.checked; save(); };

// ---------- audio ----------
let ac=null;
function audio(){ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; }
function tone(freq, t0, dur, vol=.5, type='sine'){
  const a=audio(), o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(a.destination);
  const t=a.currentTime+t0;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t); o.stop(t+dur+.05);
}

const buf = {};
function loadSounds(){
  const a = audio();
  for(const k in B64){
    if(buf[k]) continue;
    const bin = atob(B64[k]), u = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    a.decodeAudioData(u.buffer, b=>buf[k]=b, ()=>{});
  }
}
let cdSrc=null;
function play(k, when=0, offset=0){
  if(!buf[k]) return null;
  const a=audio(), s=a.createBufferSource();
  s.buffer=buf[k]; s.connect(a.destination);
  s.start(a.currentTime+Math.max(0,when), offset);
  return s;
}
function stopCountdown(){ if(cdSrc){ try{cdSrc.stop();}catch(e){} cdSrc=null; } }
const CD_LEAD = 3.03; // the countdown's last beep lands on the start of the round
const SND = {
  bell(){ play('bell'); },
  warn(){ tone(1500,0,.1,.4,'square'); tone(1500,.18,.1,.4,'square'); }
};

// ---------- workout engine ----------
let cdDone=false, phases=[], idx=0, phaseStart=0, phaseDur=0, paused=false, pausedLeft=0, timer=null, lastSec=-1, wake=null;

function build(){
  phases=[];
  if(S.prep>0) phases.push({kind:'prep',dur:S.prep});
  for(let r=1;r<=S.rounds;r++){
    phases.push({kind:'work',dur:S.work,round:r});
    if(r<S.rounds && S.rest>0) phases.push({kind:'rest',dur:S.rest,round:r});
  }
}
const LABEL = {prep:'GET READY', work:'FIGHT!', rest:'REST'};

function enter(i, silent){
  idx=i;
  if(idx>=phases.length) return finish();
  const p=phases[idx];
  stopCountdown(); cdDone=false;
  phaseDur=p.dur; phaseStart=performance.now(); lastSec=-1; paused=false;
  document.body.className=p.kind;
  $('phase').textContent=LABEL[p.kind];
  $('roundInfo').textContent = p.kind==='prep' ? `${S.rounds} rounds` : `Round ${p.round} of ${S.rounds}`;
  const n=phases[idx+1];
  $('next').textContent = n ? `Next: ${LABEL[n.kind]} · ${fmt(n.dur)}` : 'Last round';
  $('pause').textContent='⏸ Pause';
  if(!silent){
    if(p.kind==='work' || p.kind==='rest') SND.bell();
    $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go');
    if(navigator.vibrate) navigator.vibrate(p.kind==='work'?[200,80,200]:300);
  }
}

function tick(){
  if(paused) return;
  const left = phaseDur - (performance.now()-phaseStart)/1000;
  const p = phases[idx];
  $('time').textContent = fmt(left);
  $('barfill').style.width = Math.min(100,(1-left/phaseDur)*100)+'%';
  const sec = Math.ceil(left);
  if(sec!==lastSec){
    lastSec=sec;
    if(S.warn && p.kind==='work' && sec===10 && phaseDur>15) SND.warn();
  }
  const nx = phases[idx+1];
  if(!cdDone && nx && nx.kind==='work' && left<=CD_LEAD+.25){
    cdDone=true;
    if(left>=CD_LEAD) cdSrc=play('countdown', left-CD_LEAD);
    else cdSrc=play('countdown', 0, CD_LEAD-left);
  }
  if(left<=0) enter(idx+1);
}

function start(){
  loadSounds(); build();
  $('setup').classList.remove('on'); $('run').classList.add('on');
  enter(0);
  clearInterval(timer); timer=setInterval(tick,100); tick();
  if(navigator.wakeLock) navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{});
}
function finish(){
  clearInterval(timer); stopCountdown();
  document.body.className='done';
  $('phase').textContent='DONE! 💪';
  $('roundInfo').textContent=`${S.rounds} rounds · ${fmt(S.rounds*S.work)} min on the bag`;
  $('time').textContent='0:00'; $('barfill').style.width='100%'; $('next').textContent='';
  $('pause').style.display='none'; $('skip').style.display='none'; $('stop').textContent='Back';
  SND.bell(); if(navigator.vibrate) navigator.vibrate([300,100,300,100,600]);
  if(wake){ wake.release(); wake=null; }
}
function stop(){
  clearInterval(timer); stopCountdown(); paused=false;
  document.body.className='';
  $('run').classList.remove('on'); $('setup').classList.add('on');
  $('pause').style.display=''; $('skip').style.display=''; $('stop').textContent='■ Stop';
  if(wake){ wake.release(); wake=null; }
}
$('start').onclick=start;
$('stop').onclick=stop;
$('skip').onclick=()=>enter(idx+1);
$('pause').onclick=()=>{
  if(!paused){ paused=true; stopCountdown(); pausedLeft=phaseDur-(performance.now()-phaseStart)/1000; $('pause').textContent='▶ Resume'; }
  else { phaseStart=performance.now()-(phaseDur-pausedLeft)*1000; paused=false; cdDone=pausedLeft<CD_LEAD+.25; $('pause').textContent='⏸ Pause'; audio(); }
};
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && timer && navigator.wakeLock && !wake && $('run').classList.contains('on'))
    navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{});
});
renderSetup();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
